plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def licenseFile = file('LICENSE')
def commonJava = file('common/src/main/java')
def commonResources = file('common/src/main/resources')

subprojects {
	def obfuscated = project.property('obfuscated').toBoolean()
	apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

	def mcLabel = project.property('mc_label').toString()
	def javaVersion = project.property('java_version').toInteger()
	def modVersion = "${project.mod_version}+${mcLabel}".toString()

	version = "${project.mod_version}-mc${mcLabel}".toString()
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	repositories {
		maven {
			name = 'Terraformers'
			url = 'https://maven.terraformersmc.com/releases/'
		}
	}

	sourceSets {
		main {
			java.srcDir commonJava
			resources.srcDir commonResources
		}
	}

	loom {
		runs {
			client {
				programArgs "--username", "FlowDev"
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		if (obfuscated) {
			mappings loom.officialMojangMappings()
			modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
			modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
			modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		} else {
			implementation "net.fabricmc:fabric-loader:${project.loader_version}"
			implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
			compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		}
	}

	def props = [
		version : modVersion,
		loader  : project.loader_min,
		mcRange : project.property('mc_range').toString(),
		java    : javaVersion.toString()
	]

	processResources {
		inputs.properties props
		filesMatching("fabric.mod.json") {
			expand props
		}
	}

	jar {
		from(licenseFile) {
			rename { "LICENSE_FlowTrails" }
		}
		manifest {
			attributes(
				"Implementation-Title": "FlowTrails",
				"Implementation-Version": modVersion,
				"Implementation-Vendor": "mesdev",
				"Created-By": "mesdev"
			)
		}
	}

	def classpathOut = layout.buildDirectory.file('classpath.txt')
	def compileClasspath = sourceSets.main.compileClasspath
	tasks.register('dumpClasspath') {
		doLast {
			def out = classpathOut.get().asFile
			out.parentFile.mkdirs()
			out.text = compileClasspath.asPath
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}
}

tasks.register('collectJars', Copy) {
	group = 'build'
	description = 'Builds every version and copies the jars into build/libs.'
	subprojects.each { p ->
		def task = p.tasks.findByName('remapJar') ?: p.tasks.named('jar').get()
		dependsOn task
		from task
	}
	into layout.buildDirectory.dir('libs')
}
